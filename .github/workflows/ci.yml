name: BetMatrix CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Verified data integrity tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Verify bundled server syntax
        run: node --check dist/server.cjs

      - name: Runtime smoke test
        run: |
          node dist/server.cjs > /tmp/betmatrix-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          sleep 2
          curl --fail --silent --show-error http://127.0.0.1:3000/api/health

      - name: Verify production assets
        run: test -f dist/index.html && test -f dist/server.cjs
